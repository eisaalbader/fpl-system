name: report

# Builds the decision report before each deadline.
on:
  schedule:
    - cron: '0 9 * * 5'    # Friday 09:00 UTC
    - cron: '0 16 * * 5'   # Friday 16:00 UTC (after press conferences)
    - cron: '0 8 * * 6'    # Saturday 08:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Verify FPL rules have not drifted
        run: python src/rules_check.py
        continue-on-error: true   # warn, never block the report

      - name: Build report
        run: python src/report.py

      - name: Commit
        run: |
          git config user.name  "fpl-reporter"
          git config user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet || {
            git commit -m "report $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          }
