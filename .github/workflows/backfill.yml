name: backfill

# Run once to build data/history.parquet (7 seasons, ~186k rows).
# Re-run after each completed season.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly refresh, Monday 04:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/backfill.py
      - name: Commit
        run: |
          git config user.name  "fpl-backfill"
          git config user.email "actions@github.com"
          git add data/history.parquet
          git diff --staged --quiet || {
            git commit -m "backfill history $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          }
